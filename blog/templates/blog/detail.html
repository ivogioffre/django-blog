<h1>{{ post.title }}</h1>

<p>{{ post.body }}</p>

<p>
    Publicado: {{ post.created_on }}
</p>

<h2>Comentarios</h2>

{% for comment in comments %}
    <p>
        <strong>{{ comment.author }}</strong>
        dijo:
    </p>

    <p>{{ comment.body }}</p>
{% empty %}
    <p>No hay comentarios todavía.</p>
{% endfor %}

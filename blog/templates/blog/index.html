<h1>Blog</h1>

{% for post in posts %}
    <h2>
        <a href="{% url 'blog_detail' post.pk %}">
            {{ post.title }}
        </a>
    </h2>

    <p>{{ post.body }}</p>

    <p>
        Categorías:
        {% for category in post.categories.all %}
            <a href="{% url 'blog_category' category.name %}">
                {{ category.name }}
            </a>
        {% endfor %}
    </p>
{% endfor %}

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ivo Gioffre | Portfolio{% endblock %}</title>
  <meta name="description" content="Portfolio personal de Ivo Gioffre, desarrollador.">
  <link rel="icon" type="image/svg+xml" href="{% static 'assets/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <header id="inicio" class="site-header">
    <nav class="navbar navbar-expand-lg fixed-top navbar-neon">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}#inicio">IVO<span class="brand-dot">.</span>GIOFFRE</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menú">
          <i class="fa-solid fa-bars text-neon"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="btn btn-neon" href="{% url 'home' %}#sobre-mi">Sobre mí</a></li>
            <li class="nav-item"><a class="btn btn-neon" href="{% url 'home' %}#habilidades">Habilidades</a></li>
            <li class="nav-item"><a class="btn btn-neon" href="{% url 'home' %}#proyectos">Proyectos</a></li>
            <li class="nav-item"><a class="btn btn-neon" href="{% url 'blog_index' %}">Blog</a></li>
            <li class="nav-item"><a class="btn btn-neon" href="{% url 'home' %}#contacto">Contacto</a></li>
            <li class="nav-item">
              <input type="checkbox" id="themeSwitch" class="theme-switch-input">
              <label for="themeSwitch" class="btn btn-outline-toggle ms-lg-2" title="Cambiar modo claro/oscuro">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
              </label>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span id="year"></span> Ivo Gioffre. Hecho con Django, HTML, CSS y Bootstrap.</p>
      <div class="footer-socials">
        <a href="https://github.com/ivogioffre" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:ivogioffre@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
